# Publish to PyPI when a GitHub Release is published.
#
# Release procedure:
#   1. Bump the version in a PR: `uv version --bump patch|minor|major`
#   2. After merging, create a GitHub Release with the tag `v<version>` (e.g. v0.2.0)
#
# Nothing is uploaded unless the test suite passes on all supported Pythons
# with the newest dependencies (tests.yml).
#
# Uploads use PyPI trusted publishing (no API token). The trusted publisher on
# PyPI is configured for this repository, workflow `publish.yml` and
# environment `pypi`.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/tests.yml
    with:
      python-versions: '["3.11", "3.12", "3.13"]'

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false  # no cache in release builds

      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Release tag '${TAG}' does not match the version in pyproject.toml (expected 'v${version}')"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import overtone; print(overtone.__version__)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/overtone-vpt2/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
