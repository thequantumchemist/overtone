[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "overtone-vpt2"  # "overtone" on PyPI is held by an empty project (PEP 541 request pending)
version = "0.1.0"
description = "Anharmonic vibrational spectra (fundamentals, overtones, combination bands, IR/NIR intensities) with VPT2 for any ASE calculator"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"  # SPDX identifier; use "GPL-3.0-or-later" to allow later versions
license-files = ["LICENSE"]
authors = [
    { name = "Basila Bhanu Pattani Ameerjan" },
    { name = "Mads-Peter Verner Christiansen" },
    { name = "Wilke Dononelli", email = "wido@uni-bremen.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy",
    "scipy",
    "ase>=3.23",
    "pydantic>=2.0",
    "rich",
    "matplotlib",  # spectrum plotting is part of the core package
]

[project.optional-dependencies]
plot = []  # kept for compatibility; matplotlib is now core
cluster = ["shephex"]  # multi-node / queueing system runs
falcon = ["falcon-md"]  # on-the-fly active learning
tutorial = ["tblite"]
test = ["pytest", "pytest-cov", "shephex", "tblite"]

[dependency-groups]
docs = ["zensical"]  # only for building the documentation site

[project.urls]
Homepage = "https://github.com/thequantumchemist/overtone"
Repository = "https://github.com/thequantumchemist/overtone"

[tool.uv.build-backend]
# The import name stays "overtone" although the distribution is "overtone-vpt2"
module-name = "overtone"
# Ship the test suite in the sdist, as MANIFEST.in did
source-include = ["tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # shared test code: `from helpers.models import ...`
addopts = ["--import-mode=importlib"]
markers = [
    "slow: takes more than a few seconds (deselect with -m 'not slow')",
    "tutorial: runs a script from tutorials/ (about 30 s in total; deselect with -m 'not tutorial')",
]
filterwarnings = [
    # NumPy 2.5 deprecation raised inside ASE itself, not in OVERTONE
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.coverage.run]
source = ["overtone"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["helpers"]  # tests/helpers, on the pytest pythonpath
